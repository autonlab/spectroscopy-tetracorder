name: Deploy MkDocs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tetracorderpy/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/staticrypt/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "tetracorderpy/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/staticrypt/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docs
            tetracorderpy
            mkdocs.yml
            pyproject.toml
            uv.lock
            .github/staticrypt
          sparse-checkout-cone-mode: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install documentation dependencies
        run: >-
          uv sync --locked --no-default-groups --group docs
          --no-install-project

      - name: Build MkDocs
        run: uv run --locked --no-sync mkdocs build --strict --site-dir site

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Encrypt documentation
        env:
          STATICRYPT_PASSWORD: ${{ github.event_name == 'pull_request' && 'pull-request-validation-only' || secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "${STATICRYPT_PASSWORD}" ]; then
            echo "::error::Repository secret STATICRYPT_PASSWORD is not configured."
            exit 1
          fi

          npx --yes staticrypt@3.5.4 site/* -r -d site \
            --config .github/staticrypt/config.json \
            --template .github/staticrypt/password-template.html \
            --short \
            --remember 14 \
            --template-title "Tetracorder documentation" \
            --template-instructions "Enter the shared passphrase to continue." \
            --template-placeholder "Shared passphrase" \
            --template-button "Unlock documentation" \
            --template-error "That passphrase did not work." \
            --template-remember "Remember this device" \
            --template-toggle-show "Show" \
            --template-toggle-hide "Hide"

          html_count=$(find site -type f -name '*.html' | wc -l)
          encrypted_count=$(find site -type f -name '*.html' \
            -exec grep -l 'staticryptInitiator' {} + | wc -l)

          if [ "${html_count}" -eq 0 ] || [ "${encrypted_count}" -ne "${html_count}" ]; then
            echo "::error::Expected ${html_count} encrypted HTML files, found ${encrypted_count}."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
