<!doctype html>
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <title>/*[|template_title|]*/0</title>

    <style>
      /* Keep these theme tokens aligned with docs/stylesheets/extra.css. */
      :root {
        --tc-ink: #172a3a;
        --tc-muted: #5d6b78;
        --tc-surface: #f7f9fb;
        --tc-border: #d9e0e6;
        --tc-primary: #1f3a56;
        --tc-primary-light: #365b78;
        --tc-accent: #087f8c;
        --tc-card: rgba(255, 255, 255, 0.94);
        --tc-error: #a13d3d;
        --tc-shadow: 0 24px 72px rgba(23, 42, 58, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --tc-ink: #edf2f5;
          --tc-muted: #acb8c2;
          --tc-surface: #101820;
          --tc-border: #33434f;
          --tc-primary: #69c2cc;
          --tc-primary-light: #87d3dc;
          --tc-accent: #69c2cc;
          --tc-card: rgba(23, 35, 45, 0.94);
          --tc-error: #ff9b9b;
          --tc-shadow: 0 24px 72px rgba(0, 0, 0, 0.32);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      .staticrypt-html,
      .staticrypt-body {
        min-height: 100%;
      }

      .staticrypt-body {
        margin: 0;
        background:
          radial-gradient(circle at 15% 10%, rgba(8, 127, 140, 0.12), transparent 36rem),
          radial-gradient(circle at 88% 92%, rgba(31, 58, 86, 0.1), transparent 32rem),
          var(--tc-surface);
        color: var(--tc-ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .hidden {
        display: none !important;
      }

      .staticrypt-loading,
      .staticrypt-shell {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .staticrypt-loading {
        display: grid;
        place-items: center;
      }

      .staticrypt-spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid var(--tc-border);
        border-top-color: var(--tc-accent);
        border-radius: 999px;
        animation: staticrypt-spin 0.8s linear infinite;
      }

      @keyframes staticrypt-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .staticrypt-shell {
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .staticrypt-card {
        width: min(100%, 27rem);
        padding: clamp(1.75rem, 6vw, 2.5rem);
        background: var(--tc-card);
        border: 1px solid var(--tc-border);
        border-radius: 16px;
        box-shadow: var(--tc-shadow);
        backdrop-filter: blur(16px);
      }

      .staticrypt-title {
        margin: 0;
        font-size: clamp(1.6rem, 7vw, 2rem);
        font-weight: 650;
        letter-spacing: -0.025em;
        line-height: 1.16;
      }

      .staticrypt-instructions {
        margin: 0.75rem 0 1.8rem;
        color: var(--tc-muted);
        font-size: 0.94rem;
        line-height: 1.55;
      }

      .staticrypt-field-label {
        display: block;
        margin: 0 0 0.5rem;
        font-size: 0.82rem;
        font-weight: 650;
      }

      .staticrypt-password-row {
        position: relative;
      }

      .staticrypt-password {
        width: 100%;
        min-height: 3rem;
        padding: 0.72rem 4rem 0.72rem 0.9rem;
        background: transparent;
        color: var(--tc-ink);
        border: 1px solid var(--tc-border);
        border-radius: 8px;
        font: inherit;
        outline: none;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }

      .staticrypt-password:focus {
        border-color: var(--tc-accent);
        box-shadow: 0 0 0 3px rgba(8, 127, 140, 0.15);
      }

      .staticrypt-toggle {
        position: absolute;
        top: 50%;
        right: 0.45rem;
        transform: translateY(-50%);
        padding: 0.45rem 0.55rem;
        background: transparent;
        color: var(--tc-muted);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-size: 0.78rem;
      }

      .staticrypt-toggle:hover,
      .staticrypt-toggle:focus-visible {
        background: rgba(8, 127, 140, 0.08);
        color: var(--tc-ink);
        outline: none;
      }

      .staticrypt-error {
        min-height: 1.25rem;
        margin: 0.55rem 0 0;
        color: var(--tc-error);
        font-size: 0.8rem;
      }

      .staticrypt-remember {
        display: flex;
        align-items: center;
        gap: 0.58rem;
        margin: 0.85rem 0 1.25rem;
        color: var(--tc-muted);
        cursor: pointer;
        font-size: 0.84rem;
        user-select: none;
      }

      .staticrypt-remember input {
        width: 1rem;
        height: 1rem;
        margin: 0;
        accent-color: var(--tc-accent);
      }

      .staticrypt-submit {
        width: 100%;
        min-height: 3rem;
        padding: 0.72rem 1rem;
        background: var(--tc-primary);
        color: white;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        transition: background 140ms ease, transform 140ms ease;
      }

      @media (prefers-color-scheme: dark) {
        .staticrypt-submit {
          color: #101820;
        }
      }

      .staticrypt-submit:hover {
        background: var(--tc-primary-light);
      }

      .staticrypt-submit:active {
        transform: translateY(1px);
      }

      .staticrypt-submit:focus-visible {
        outline: 3px solid rgba(8, 127, 140, 0.22);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-loading" aria-label="Loading">
      <div class="staticrypt-spinner" aria-hidden="true"></div>
    </div>

    <main id="staticrypt_content" class="staticrypt-shell hidden">
      <section class="staticrypt-card" aria-labelledby="staticrypt-title">
        <h1 id="staticrypt-title" class="staticrypt-title">/*[|template_title|]*/0</h1>
        <p class="staticrypt-instructions">/*[|template_instructions|]*/0</p>

        <form id="staticrypt-form" action="#" method="post">
          <label class="staticrypt-field-label" for="staticrypt-password">Passphrase</label>
          <div class="staticrypt-password-row">
            <input
              id="staticrypt-password"
              class="staticrypt-password"
              type="password"
              name="password"
              placeholder="/*[|template_placeholder|]*/0"
              autocomplete="current-password"
              autofocus
              required
            />
            <button
              id="staticrypt-toggle"
              class="staticrypt-toggle"
              type="button"
              aria-controls="staticrypt-password"
              aria-pressed="false"
            >
              /*[|template_toggle_show|]*/0
            </button>
          </div>

          <p id="staticrypt-error" class="staticrypt-error" role="alert" aria-live="polite"></p>

          <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
            <input id="staticrypt-remember" type="checkbox" name="remember" />
            <span>/*[|template_remember|]*/0</span>
          </label>

          <input class="staticrypt-submit" type="submit" value="/*[|template_button|]*/0" />
        </form>
      </section>
    </main>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0";
      const templateToggleAltShow = "/*[|template_toggle_show|]*/0";
      const templateToggleAltHide = "/*[|template_toggle_hide|]*/0";
      const isRememberEnabled = /*[|is_remember_enabled|]*/ 0;
      const staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "spectroscopy_tetracorder_staticrypt_expiration",
        rememberPassphraseKey: "spectroscopy_tetracorder_staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.addEventListener("load", async () => {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (isSuccessful) return;

        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        document.getElementById("staticrypt-password").focus();

        if (isRememberEnabled) {
          document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      });

      const passwordInput = document.getElementById("staticrypt-password");
      const toggleButton = document.getElementById("staticrypt-toggle");
      const errorMessage = document.getElementById("staticrypt-error");

      toggleButton.addEventListener("click", () => {
        const isVisible = passwordInput.type === "text";
        passwordInput.type = isVisible ? "password" : "text";
        toggleButton.textContent = isVisible ? templateToggleAltShow : templateToggleAltHide;
        toggleButton.setAttribute("aria-pressed", String(!isVisible));
        passwordInput.focus();
      });

      passwordInput.addEventListener("input", () => {
        errorMessage.textContent = "";
      });

      document.getElementById("staticrypt-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        errorMessage.textContent = "";

        const remember = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(passwordInput.value, remember);

        if (!isSuccessful) {
          errorMessage.textContent = templateError;
          passwordInput.select();
        }
      });
    </script>
  </body>
</html>
