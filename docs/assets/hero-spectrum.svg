<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">A hyperspectral cube and reflectance curve</title>
  <desc id="desc">A layered image cube connected to a wavelength plot with three absorption features.</desc>
  <defs>
    <linearGradient id="cube" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#11b5a4"/><stop offset=".5" stop-color="#6874ef"/><stop offset="1" stop-color="#d853ad"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19bea9"/><stop offset=".55" stop-color="#6c73ee"/><stop offset="1" stop-color="#e257aa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0a1730" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M96 116l172-58 126 70-174 60z" fill="url(#cube)" opacity=".88"/>
    <path d="M96 116v116l124 72V188z" fill="#263c72"/>
    <path d="M220 188l174-60v114l-174 62z" fill="#172746"/>
    <path d="M111 143l108 62 158-54M111 174l108 62 158-54M111 205l108 62 158-54" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <g fill="#fff" fill-opacity=".72"><circle cx="245" cy="150" r="7"/><circle cx="266" cy="143" r="7"/><circle cx="287" cy="136" r="7"/></g>
  </g>
  <path d="M287 136C377 112 390 205 446 221" fill="none" stroke="#8b98b6" stroke-width="2" stroke-dasharray="7 8"/>
  <g transform="translate(400 156)">
    <rect width="316" height="222" rx="22" fill="#fff" fill-opacity=".96" stroke="#cbd4e5"/>
    <path d="M43 28v151h242" fill="none" stroke="#9aa8bf" stroke-width="2"/>
    <path d="M45 78C76 72 94 54 121 62s24 68 49 68 24-75 51-68 16 43 36 42 20-31 28-39" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
    <g fill="#68748b" font-family="system-ui, sans-serif" font-size="13">
      <text x="119" y="207">wavelength</text><text x="-145" y="17" transform="rotate(-90)">reflectance</text>
    </g>
    <g fill="#d853ad"><circle cx="170" cy="130" r="5"/><circle cx="257" cy="104" r="5"/></g>
  </g>
</svg>
